<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>S-024 アカウント削除中</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Hiragino Sans, sans-serif; background: #0F172A; color: #fff; min-width: 1440px; font-size: 14px; line-height: 1.5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    /* スピナー */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .spinner {
      width: 52px; height: 52px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    /* ステップ進捗 */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .step-active { animation: pulse 1.4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div style="display:flex; flex-direction:column; align-items:center; gap:0; text-align:center; max-width:400px;">

    <!-- スピナー -->
    <div style="margin-bottom:32px;">
      <div class="spinner"></div>
    </div>

    <!-- タイトル -->
    <h1 style="font-size:22px; font-weight:700; color:#fff; margin-bottom:10px;">アカウントを削除しています</h1>
    <p style="font-size:14px; color:#94A3B8; margin-bottom:40px;">しばらくお待ちください。ページを閉じないでください。</p>

    <!-- 処理ステップ -->
    <div style="width:100%; display:flex; flex-direction:column; gap:12px; margin-bottom:40px;">

      <!-- ステップ1：完了 -->
      <div style="display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.05); border-radius:8px; padding:12px 16px;">
        <div style="width:24px; height:24px; border-radius:50%; background:#16A34A; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
        </div>
        <span style="font-size:14px; color:#D1FAE5; font-weight:500;">学習計画・タスクを削除しました</span>
      </div>

      <!-- ステップ2：処理中（アクティブ） -->
      <div class="step-active" style="display:flex; align-items:center; gap:12px; background:rgba(37,99,235,0.15); border:1px solid rgba(37,99,235,0.4); border-radius:8px; padding:12px 16px;">
        <div style="width:24px; height:24px; flex-shrink:0;">
          <div style="width:24px; height:24px; border:3px solid rgba(255,255,255,0.2); border-top-color:#60A5FA; border-radius:50%; animation:spin 0.9s linear infinite;"></div>
        </div>
        <span style="font-size:14px; color:#93C5FD; font-weight:500;">ナレッジ・コメントを削除中…</span>
      </div>

      <!-- ステップ3：待機 -->
      <div style="display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.03); border-radius:8px; padding:12px 16px;">
        <div style="width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <span style="font-size:11px; color:#64748B; font-weight:700;">3</span>
        </div>
        <span style="font-size:14px; color:#475569;">アカウント情報を削除</span>
      </div>

      <!-- ステップ4：待機 -->
      <div style="display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.03); border-radius:8px; padding:12px 16px;">
        <div style="width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <span style="font-size:11px; color:#64748B; font-weight:700;">4</span>
        </div>
        <span style="font-size:14px; color:#475569;">セッションを終了</span>
      </div>
    </div>

    <!-- 注意文 -->
    <div style="background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); border-radius:8px; padding:12px 16px; display:flex; align-items:flex-start; gap:8px; text-align:left;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#F59E0B" stroke-width="2" style="flex-shrink:0; margin-top:1px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
      <p style="font-size:13px; color:#FCD34D; line-height:1.6;">ページを閉じたりブラウザを終了しないでください。<br>削除が完了すると自動的にトップページに移動します。</p>
    </div>
  </div>

  <div style="position:fixed; top:16px; right:16px; background:#DC2626; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;">
    状態: 削除処理中
  </div>

  <div style="position:fixed; bottom:16px; right:16px; background:rgba(255,255,255,0.1); color:#fff; padding:10px 14px; border-radius:8px; font-size:11px; line-height:1.8; z-index:200;">
    <div style="font-weight:600; margin-bottom:4px;">Tab移動順序</div>
    <div style="color:#94A3B8;">なし（操作可能な要素なし）</div>
    <div style="font-size:10px; color:#64748B; margin-top:4px;">処理完了後に自動遷移</div>
  </div>
</body>
</html>
