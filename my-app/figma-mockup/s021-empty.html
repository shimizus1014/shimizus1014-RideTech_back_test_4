<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>S-021 コメント管理（データなし）</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F8FAFC; color: #0F172A; min-width: 1440px; font-size: 14px; line-height: 1.5; }
    .admin-nav { background: #1E293B; color: #fff; padding: 0 32px; display: flex; align-items: center; gap: 0; height: 52px; position: sticky; top: 0; z-index: 50; }
    .admin-tab { display: flex; align-items: center; height: 52px; padding: 0 20px; font-size: 14px; text-decoration: none; color: #94A3B8; border-bottom: 3px solid transparent; }
    .admin-tab.active { color: #fff; border-bottom-color: #2563EB; }
    .filter-tab { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; border: none; background: none; font-family: inherit; color: #64748B; }
    .filter-tab.active { background: #2563EB; color: #fff; }
    .count-badge { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #E2E8F0; }
    th { background: #F8FAFC; font-size: 12px; font-weight: 600; color: #64748B; padding: 10px 16px; text-align: left; border-bottom: 1px solid #E2E8F0; }
    td { padding: 12px 16px; border-bottom: 1px solid #F1F5F9; font-size: 14px; }
  </style>
</head>
<body>

  <nav class="admin-nav">
    <div style="display:flex; align-items:center; gap:8px; margin-right:24px;">
      <div style="width:24px; height:24px; border-radius:4px; background:#2563EB; display:flex; align-items:center; justify-content:center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
      </div>
      <span style="font-size:14px; font-weight:700; color:#fff;">管理者パネル</span>
    </div>
    <div style="width:1px; height:24px; background:#334155; margin-right:8px;"></div>
    <a href="s019.html" class="admin-tab">ユーザー管理</a>
    <a href="s021.html" class="admin-tab active">コメント管理</a>
    <div style="margin-left:auto; display:flex; align-items:center; gap:20px;">
      <a href="s007.html" style="font-size:13px; color:#94A3B8; text-decoration:none;">一般画面に戻る</a>
      <button style="font-size:13px; color:#94A3B8; background:none; border:none; cursor:pointer;">ログアウト</button>
    </div>
  </nav>

  <div style="padding:32px 40px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px; font-weight:700; color:#0F172A; margin-bottom:4px;">コメント管理</h1>
        <p style="font-size:13px; color:#64748B;">不適切なコメントを確認・削除できます。</p>
      </div>
      <span style="font-size:13px; color:#64748B;">全 0 件</span>
    </div>

    <div style="display:flex; align-items:center; gap:4px; background:#F1F5F9; border-radius:8px; padding:4px; width:fit-content; margin-bottom:16px;">
      <button class="filter-tab active">すべて <span class="count-badge" style="background:rgba(255,255,255,0.25); color:#fff;">0</span></button>
      <button class="filter-tab">学習計画コメント <span class="count-badge" style="background:#E2E8F0; color:#64748B;">0</span></button>
      <button class="filter-tab">タスクコメント <span class="count-badge" style="background:#E2E8F0; color:#64748B;">0</span></button>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:150px;">投稿者</th>
          <th>コメント内容</th>
          <th style="width:220px;">投稿先（所有者 / 計画 / タスク）</th>
          <th style="width:100px;">種別</th>
          <th style="width:100px;">投稿日時</th>
          <th style="width:72px; text-align:center;">削除</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="6">
            <div style="padding:52px 0; display:flex; flex-direction:column; align-items:center; text-align:center;">
              <div style="width:56px; height:56px; border-radius:50%; background:#F1F5F9; display:flex; align-items:center; justify-content:center; margin-bottom:12px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="#94A3B8" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z"/></svg>
              </div>
              <p style="font-size:15px; font-weight:600; color:#0F172A; margin-bottom:4px;">コメントがありません</p>
              <p style="font-size:13px; color:#64748B; max-width:280px;">現在管理が必要なコメントはありません。新しいコメントが投稿されると、ここに表示されます。</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div style="position:fixed; top:68px; right:16px; background:#D97706; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;">
    状態: データなし（EmptyState）
  </div>
</body>
</html>
