<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>S-015 ユーザー検索（結果なし）</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F8FAFC; color: #0F172A; min-width: 1440px; font-size: 14px; line-height: 1.5; }
    .nav-link { display: flex; align-items: center; gap: 8px; padding: 10px 16px; text-decoration: none; font-size: 14px; color: #64748B; }

    .input { border: 1px solid #E2E8F0; border-radius: 6px; padding: 9px 12px 9px 36px; font-size: 14px; color: #0F172A; background: #fff; outline: none; font-family: inherit; width: 100%; }
    .btn-primary { background: #2563EB; color: #fff; border: none; border-radius: 6px; padding: 9px 20px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; }

<body>
  <div style="display:flex; min-height:100vh;">

        <div style="width:32px; height:32px; border-radius:50%; background:#2563EB; display:flex; align-items:center; justify-content:center; flex-shrink:0;">

        <span style="font-size:13px; font-weight:600;">学習管理システム</span>

      <nav style="flex:1; padding:8px 0;">

        <a href="s008.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>学習計画一覧</a>
        <a href="s015.html" class="nav-link active"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>ユーザー検索</a>

      <div style="padding:12px 16px; border-top:1px solid #E2E8F0;"><button style="font-size:12px; color:#64748B; background:none; border:none; cursor:pointer;">ログアウト</button></div>
    </aside>

    <main style="flex:1; padding:32px; min-width:0;">
      <h1 style="font-size:20px; font-weight:700; margin-bottom:24px;">ユーザー検索</h1>

      <div style="display:flex; gap:10px; max-width:600px; margin-bottom:8px;">
        <div style="flex:1; position:relative;">
          <svg style="position:absolute; left:10px; top:50%; transform:translateY(-50%); pointer-events:none;" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#94A3B8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="search" class="input" value="xxxxxx">
        </div>
        <button class="btn-primary">検索</button>
      </div>
      <p style="font-size:13px; color:#64748B; margin-bottom:32px; max-width:600px;">「xxxxxx」の検索結果：<strong style="color:#0F172A;">0件</strong></p>

      <!-- Empty state -->
      <div style="display:flex; flex-direction:column; align-items:center; padding:40px 20px; text-align:center; max-width:600px;">
        <div style="width:72px; height:72px; border-radius:50%; background:#F1F5F9; display:flex; align-items:center; justify-content:center; margin-bottom:16px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="#94A3B8" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.182 16.318A4.486 4.486 0 0012.016 15a4.486 4.486 0 00-3.198 1.318M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75zm-.375 0h.008v.015h-.008V9.75zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75z"/></svg>
        </div>
        <p style="font-size:16px; font-weight:600; color:#0F172A; margin-bottom:8px;">ユーザーが見つかりませんでした</p>
        <p style="font-size:14px; color:#64748B; line-height:1.7; margin-bottom:20px;">
          「xxxxxx」に一致するユーザーはいません。<br>
          別のキーワードで検索してみてください。
        </p>
        <div style="background:#F8FAFC; border:1px solid #E2E8F0; border-radius:8px; padding:14px 20px; font-size:13px; color:#64748B; text-align:left;">
          <p style="font-weight:500; color:#0F172A; margin-bottom:6px;">検索のヒント</p>
          <ul style="padding-left:16px; line-height:2;">
            <li>ユーザー名の一部でも検索できます</li>
            <li>公開学習計画のタイトルでも検索できます</li>
            <li>スペルを確認してください</li>
          </ul>
        </div>
      </div>

      <div style="position:fixed; top:16px; right:16px; background:#F59E0B; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;">
        状態: 結果なし（EmptyState）
