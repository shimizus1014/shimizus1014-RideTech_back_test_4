<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>S-015 ユーザー検索（エラー）</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F8FAFC; color: #0F172A; min-width: 1440px; font-size: 14px; line-height: 1.5; }
    .nav-link { display: flex; align-items: center; gap: 8px; padding: 10px 16px; text-decoration: none; font-size: 14px; color: #64748B; }
    .nav-link.active { color: #2563EB; font-weight: 500; background: #EFF6FF; border-right: 2px solid #2563EB; }
    .input { border: 1px solid #E2E8F0; border-radius: 6px; padding: 9px 12px 9px 36px; font-size: 14px; color: #0F172A; background: #fff; outline: none; font-family: inherit; width: 100%; }
    .btn-primary { background: #2563EB; color: #fff; border: none; border-radius: 6px; padding: 9px 20px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; }
  </style>
</head>
<body>
  <div style="display:flex; min-height:100vh;">
    <aside style="width:208px; min-width:208px; background:#fff; border-right:1px solid #E2E8F0; display:flex; flex-direction:column;">
      <div style="display:flex; align-items:center; gap:8px; padding:16px; border-bottom:1px solid #E2E8F0;">
        <div style="width:32px; height:32px; border-radius:50%; background:#2563EB; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
        <span style="font-size:13px; font-weight:600;">学習管理システム</span>
      </div>
      <nav style="flex:1; padding:8px 0;">
        <a href="s007.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>ダッシュボード</a>
        <a href="s008.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>学習計画一覧</a>
        <a href="s015.html" class="nav-link active"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>ユーザー検索</a>
      </nav>
      <div style="padding:12px 16px; border-top:1px solid #E2E8F0;"><button style="font-size:12px; color:#64748B; background:none; border:none; cursor:pointer;">ログアウト</button></div>
    </aside>

    <main style="flex:1; padding:32px; min-width:0;">
      <h1 style="font-size:20px; font-weight:700; margin-bottom:24px;">ユーザー検索</h1>

      <div style="display:flex; gap:10px; max-width:600px; margin-bottom:16px;">
        <div style="flex:1; position:relative;">
          <svg style="position:absolute; left:10px; top:50%; transform:translateY(-50%); pointer-events:none;" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#94A3B8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="search" class="input" value="田中">
        </div>
        <button class="btn-primary">再試行</button>
      </div>

      <!-- Error banner -->
      <div style="display:flex; align-items:flex-start; gap:10px; background:#FEF2F2; border:1px solid #FECACA; border-radius:8px; padding:14px 16px; max-width:600px; margin-bottom:32px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#DC2626" stroke-width="2" style="flex-shrink:0; margin-top:1px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
        <div>
          <p style="font-size:14px; font-weight:600; color:#B91C1C; margin-bottom:4px;">検索に失敗しました</p>
          <p style="font-size:13px; color:#DC2626;">ネットワークエラーが発生しました。しばらく待ってから「再試行」を押してください。</p>
        </div>
      </div>

      <!-- Retry guidance -->
      <div style="display:flex; flex-direction:column; align-items:center; padding:24px 20px; text-align:center; max-width:600px;">
        <div style="width:64px; height:64px; border-radius:50%; background:#FEF2F2; display:flex; align-items:center; justify-content:center; margin-bottom:14px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#DC2626" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        </div>
        <p style="font-size:15px; font-weight:600; color:#0F172A; margin-bottom:6px;">サーバーエラー（500）</p>
        <p style="font-size:13px; color:#64748B; margin-bottom:16px;">問題が続く場合はサポートにお問い合わせください。</p>
        <button class="btn-primary" style="font-size:13px; padding:8px 20px; display:flex; align-items:center; gap:6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          再試行する
        </button>
      </div>

      <div style="position:fixed; top:16px; right:16px; background:#DC2626; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;">
        状態: エラー（500）
      </div>
    </main>
  </div>
</body>
</html>
