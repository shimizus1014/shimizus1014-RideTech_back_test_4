<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>S-007 ダッシュボード（データなし）</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Hiragino Sans, sans-serif; background: #F8FAFC; color: #0F172A; min-width: 1440px; font-size: 14px; line-height: 1.5; }
    .nav-link { display: flex; align-items: center; gap: 8px; padding: 10px 16px; text-decoration: none; font-size: 14px; color: #64748B; }
    .nav-link.active { color: #2563EB; font-weight: 500; background: #EFF6FF; border-right: 2px solid #2563EB; }
    .stat-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; padding: 16px 20px; }
  </style>
</head>
<body>
  <div style="display:flex; min-height:100vh;">
    <!-- Sidebar -->
    <aside style="width:208px; min-width:208px; background:#fff; border-right:1px solid #E2E8F0; display:flex; flex-direction:column;">
      <div style="display:flex; align-items:center; gap:8px; padding:16px; border-bottom:1px solid #E2E8F0;">
        <div style="width:32px; height:32px; border-radius:50%; background:#2563EB; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <span style="font-size:13px; font-weight:600; color:#0F172A;">学習管理システム</span>
      </div>
      <nav style="flex:1; padding:8px 0;">
        <a href="s007.html" class="nav-link active">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
          </svg>
          ダッシュボード
        </a>
        <a href="s008.html" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          学習計画一覧
        </a>
        <a href="#" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          ユーザー検索
        </a>
      </nav>
      <div style="padding:12px 16px; border-top:1px solid #E2E8F0;">
        <button style="font-size:12px; color:#64748B; background:none; border:none; cursor:pointer;">ログアウト</button>
      </div>
    </aside>

    <!-- Main (empty state) -->
    <main style="flex:1; padding:32px; min-width:0;">
      <h1 style="font-size:20px; font-weight:600; color:#0F172A; margin-bottom:24px;">ダッシュボード</h1>

      <!-- Stats (all zero) -->
      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:32px;">
        <div class="stat-card">
          <p style="font-size:12px; color:#64748B; margin-bottom:6px;">アクティブ計画数</p>
          <p style="font-size:28px; font-weight:700; color:#94A3B8;">0</p>
        </div>
        <div class="stat-card">
          <p style="font-size:12px; color:#64748B; margin-bottom:6px;">完了タスク数</p>
          <p style="font-size:28px; font-weight:700; color:#94A3B8;">0</p>
        </div>
        <div class="stat-card">
          <p style="font-size:12px; color:#64748B; margin-bottom:6px;">今日の学習日数</p>
          <p style="font-size:28px; font-weight:700; color:#94A3B8;">0日</p>
        </div>
      </div>

      <!-- Empty state illustration -->
      <div style="background:#fff; border:1px dashed #CBD5E1; border-radius:12px; padding:64px 40px; display:flex; flex-direction:column; align-items:center; text-align:center;">
        <!-- Illustration: open book with a plus sign -->
        <div style="width:88px; height:88px; border-radius:50%; background:#EFF6FF; display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="#2563EB" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
          </svg>
        </div>
        <h2 style="font-size:18px; font-weight:600; color:#0F172A; margin-bottom:8px;">学習計画がまだありません</h2>
        <p style="font-size:14px; color:#64748B; margin-bottom:24px; max-width:360px;">
          最初の学習計画を作成して、学習の進捗を管理しましょう。<br>
          目標を設定してタスクを追加することができます。
        </p>
        <a href="s009-create.html" style="display:inline-flex; align-items:center; gap:6px; background:#2563EB; color:#fff; text-decoration:none; border-radius:6px; padding:9px 20px; font-size:14px; font-weight:500;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
          </svg>
          学習計画を作成する
        </a>

        <!-- Hint cards -->
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:40px; width:100%; max-width:640px;">
          <div style="background:#F8FAFC; border:1px solid #E2E8F0; border-radius:8px; padding:14px; text-align:left;">
            <div style="width:28px; height:28px; border-radius:6px; background:#DBEAFE; display:flex; align-items:center; justify-content:center; margin-bottom:8px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#2563EB" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125"/>
              </svg>
            </div>
            <p style="font-size:12px; font-weight:600; color:#0F172A; margin-bottom:4px;">計画を作成</p>
            <p style="font-size:11px; color:#64748B;">タイトルと期間を設定する</p>
          </div>
          <div style="background:#F8FAFC; border:1px solid #E2E8F0; border-radius:8px; padding:14px; text-align:left;">
            <div style="width:28px; height:28px; border-radius:6px; background:#DCFCE7; display:flex; align-items:center; justify-content:center; margin-bottom:8px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#16A34A" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <p style="font-size:12px; font-weight:600; color:#0F172A; margin-bottom:4px;">タスクを追加</p>
            <p style="font-size:11px; color:#64748B;">学習内容をタスクに分解</p>
          </div>
          <div style="background:#F8FAFC; border:1px solid #E2E8F0; border-radius:8px; padding:14px; text-align:left;">
            <div style="width:28px; height:28px; border-radius:6px; background:#FEF9C3; display:flex; align-items:center; justify-content:center; margin-bottom:8px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#CA8A04" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"/>
              </svg>
            </div>
            <p style="font-size:12px; font-weight:600; color:#0F172A; margin-bottom:4px;">進捗を確認</p>
            <p style="font-size:11px; color:#64748B;">ここで達成度を把握</p>
          </div>
        </div>
      </div>

      <div style="position:fixed; top:16px; right:16px; background:#0F172A; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;">
        状態: データなし (Empty State)
      </div>
    </main>
  </div>
</body>
</html>
