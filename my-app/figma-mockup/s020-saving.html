<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>S-020 ユーザー管理（保存中）</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F8FAFC; color: #0F172A; min-width: 1440px; font-size: 14px; line-height: 1.5; }
    .admin-nav { background: #1E293B; color: #fff; padding: 0 32px; display: flex; align-items: center; gap: 0; height: 52px; position: sticky; top: 0; z-index: 50; }
    .admin-tab { display: flex; align-items: center; height: 52px; padding: 0 20px; font-size: 14px; text-decoration: none; color: #94A3B8; border-bottom: 3px solid transparent; }
    .admin-tab.active { color: #fff; border-bottom-color: #2563EB; }
    .card { background: #fff; border: 1px solid #E2E8F0; border-radius: 10px; padding: 24px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    .input-disabled { width: 100%; border: 1px solid #E2E8F0; border-radius: 6px; padding: 9px 12px; font-size: 14px; color: #94A3B8; background: #F1F5F9; font-family: inherit; cursor: not-allowed; }
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #64748B; margin-bottom: 24px; }
    .breadcrumb a { color: #2563EB; text-decoration: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  </style>
</head>
<body>

  <nav class="admin-nav">
    <div style="display:flex; align-items:center; gap:8px; margin-right:24px;">
      <div style="width:24px; height:24px; border-radius:4px; background:#2563EB; display:flex; align-items:center; justify-content:center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
      </div>
      <span style="font-size:14px; font-weight:700; color:#fff;">管理者パネル</span>
    </div>
    <div style="width:1px; height:24px; background:#334155; margin-right:8px;"></div>
    <a href="s019.html" class="admin-tab active">ユーザー管理</a>
    <a href="s021.html" class="admin-tab">コメント管理</a>
    <div style="margin-left:auto; display:flex; align-items:center; gap:20px;">
      <a href="s007.html" style="font-size:13px; color:#94A3B8; text-decoration:none;">一般画面に戻る</a>
      <button style="font-size:13px; color:#94A3B8; background:none; border:none; cursor:pointer;">ログアウト</button>
    </div>
  </nav>

  <div style="padding:32px 40px; max-width:760px;">
    <nav class="breadcrumb">
      <a href="s019.html">ユーザー管理</a>
      <span style="color:#94A3B8;">›</span>
      <span style="color:#0F172A;">佐藤美咲</span>
    </nav>

    <h1 style="font-size:20px; font-weight:700; margin-bottom:24px;">ユーザー管理 / 佐藤美咲</h1>

    <!-- User info card (read-only) -->
    <div class="card" style="margin-bottom:16px; opacity:0.6; pointer-events:none;">
      <div style="display:flex; align-items:center; gap:16px; padding-bottom:20px; border-bottom:1px solid #F1F5F9; margin-bottom:20px;">
        <div style="width:64px; height:64px; border-radius:50%; background:#F59E0B; display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; font-weight:700; flex-shrink:0;">佐</div>
        <div>
          <p style="font-size:18px; font-weight:700; color:#0F172A; margin-bottom:2px;">佐藤美咲</p>
          <p style="font-size:14px; color:#64748B;">sato@example.com</p>
          <div style="display:flex; align-items:center; gap:6px; margin-top:6px;">
            <span style="font-size:12px; color:#94A3B8;">ユーザーID: #004</span>
            <span style="color:#E2E8F0;">·</span>
            <span style="font-size:12px; color:#94A3B8;">登録日: 2025/08/14</span>
          </div>
        </div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div>
          <label>ユーザー名</label>
          <div class="input-disabled">sato_misaki</div>
        </div>
        <div>
          <label>メールアドレス</label>
          <div class="input-disabled">sato@example.com</div>
        </div>
      </div>
    </div>

    <!-- Edit form (disabled) -->
    <div class="card" style="margin-bottom:24px; position:relative; overflow:hidden;">
      <!-- Saving overlay -->
      <div style="position:absolute; inset:0; background:rgba(248,250,252,0.7); display:flex; align-items:center; justify-content:center; z-index:5; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; background:#fff; border:1px solid #E2E8F0; border-radius:8px; padding:12px 20px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <div class="spinner" style="border-color:rgba(37,99,235,0.3); border-top-color:#2563EB;"></div>
          <span style="font-size:14px; color:#64748B; font-weight:500;">保存中...</span>
        </div>
      </div>

      <h2 style="font-size:16px; font-weight:600; margin-bottom:20px; color:#94A3B8;">権限・状態の変更</h2>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;">
        <div>
          <label style="color:#94A3B8;">アカウント状態</label>
          <div class="input-disabled">アクティブ</div>
        </div>
        <div>
          <label style="color:#94A3B8;">権限</label>
          <div class="input-disabled">一般ユーザー</div>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:12px;">
        <button disabled style="background:#93C5FD; color:#fff; border:none; border-radius:6px; padding:9px 20px; font-size:14px; font-weight:500; cursor:not-allowed; display:flex; align-items:center; gap:8px; font-family:inherit;">
          <div class="spinner"></div>
          保存中...
        </button>
        <button disabled style="background:none; color:#CBD5E1; border:1px solid #E2E8F0; border-radius:6px; padding:9px 20px; font-size:14px; font-weight:500; cursor:not-allowed; font-family:inherit;">
          キャンセル
        </button>
      </div>
    </div>

    <!-- 危険ゾーン：保存中は操作不能 -->
    <div style="background:#fff; border:1px solid #FCA5A5; border-radius:10px; padding:24px; opacity:0.45; pointer-events:none;">
      <div style="padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid #FEE2E2;">
        <h2 style="font-size:15px; font-weight:600; color:#B91C1C; margin-bottom:4px;">危険ゾーン</h2>
        <p style="font-size:13px; color:#6B7280;">以下の操作は取り消せません。慎重に操作してください。</p>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:16px;">
        <div>
          <p style="font-size:14px; font-weight:500; color:#0F172A; margin-bottom:4px;">アカウントを削除する</p>
          <p style="font-size:13px; color:#6B7280;">佐藤美咲さんのすべてのデータが完全に削除されます。</p>
        </div>
        <button disabled style="background:#fff; color:#DC2626; border:1px solid #FCA5A5; border-radius:6px; padding:9px 20px; font-size:14px; font-weight:500; cursor:not-allowed; font-family:inherit; white-space:nowrap; flex-shrink:0;">
          アカウントを削除する
        </button>
      </div>
      <p style="font-size:12px; color:#DC2626; margin-top:10px;">※ 保存処理中は削除操作できません</p>
    </div>
  </div>

  <div style="position:fixed; top:68px; right:16px; background:#64748B; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;">
    状態: 保存中（Disabled + Spinner）
  </div>
</body>
</html>
