<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>S-010 学習計画 詳細（タスクなし）</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Hiragino Sans, sans-serif; background: #F8FAFC; color: #0F172A; min-width: 1440px; font-size: 14px; line-height: 1.5; }
    .nav-link { display: flex; align-items: center; gap: 8px; padding: 10px 16px; text-decoration: none; font-size: 14px; color: #64748B; }
    .nav-link.active { color: #2563EB; font-weight: 500; background: #EFF6FF; border-right: 2px solid #2563EB; }
    .badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 12px; }
    .progress-track { background: #E2E8F0; border-radius: 4px; height: 8px; }
    .progress-fill { height: 8px; border-radius: 4px; }
    .btn-primary { display: inline-flex; align-items: center; gap: 6px; background: #2563EB; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn-danger { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #DC2626; border: 1px solid #DC2626; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn-secondary { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #374151; border: 1px solid #E2E8F0; padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    .section-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 10px; margin-bottom: 20px; }
    .section-header { padding: 16px 20px; border-bottom: 1px solid #F1F5F9; display: flex; align-items: center; justify-content: space-between; }
    .section-header h2 { font-size: 15px; font-weight: 600; color: #0F172A; }
    .comment-item { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid #F1F5F9; }
    .comment-item:last-child { border-bottom: none; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #DBEAFE; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #1D4ED8; flex-shrink: 0; }
    textarea { width: 100%; padding: 10px 12px; border: 1px solid #E2E8F0; border-radius: 6px; font-size: 14px; color: #0F172A; background: #fff; outline: none; font-family: inherit; resize: none; min-height: 80px; }
  </style>
</head>
<body>
  <div style="display:flex; min-height:100vh;">

    <!-- Sidebar -->
    <aside style="width:208px; min-width:208px; background:#fff; border-right:1px solid #E2E8F0; display:flex; flex-direction:column;">
      <div style="display:flex; align-items:center; gap:8px; padding:16px; border-bottom:1px solid #E2E8F0;">
        <div style="width:32px; height:32px; border-radius:50%; background:#2563EB; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <span style="font-size:13px; font-weight:600; color:#0F172A;">学習管理システム</span>
      </div>
      <nav style="flex:1; padding:8px 0;">
        <a href="index.html" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
          </svg>
          ダッシュボード
        </a>
        <a href="s008.html" class="nav-link active">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          学習計画一覧
        </a>
        <a href="#" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          ユーザー検索
        </a>
      </nav>
      <div style="padding:12px 16px; border-top:1px solid #E2E8F0;">
        <button style="font-size:12px; color:#64748B; background:none; border:none; cursor:pointer;">ログアウト</button>
      </div>
    </aside>

    <!-- Main -->
    <main style="flex:1; padding:32px; min-width:0;">

      <!-- Breadcrumb -->
      <nav style="display:flex; align-items:center; gap:6px; font-size:13px; color:#64748B; margin-bottom:20px;">
        <a href="s008.html" style="color:#2563EB; text-decoration:none;">学習計画一覧</a>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/>
        </svg>
        <span>React入門</span>
      </nav>

      <!-- Hero Header Card -->
      <div class="section-card" style="padding:24px; margin-bottom:20px;">
        <div style="display:flex; align-items:flex-start; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap:16px; flex:1; min-width:0;">
            <div style="width:64px; height:64px; border-radius:14px; background:#DCFCE7; display:flex; align-items:center; justify-content:center; font-size:32px; flex-shrink:0;">⚛️</div>
            <div style="flex:1; min-width:0;">
              <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
                <h1 style="font-size:22px; font-weight:700; color:#0F172A;">React入門</h1>
                <span class="badge" style="background:#DBEAFE; color:#1D4ED8;">学習中</span>
                <span class="badge" style="background:#F1F5F9; color:#64748B;">非公開</span>
              </div>
              <p style="font-size:14px; color:#64748B; margin-bottom:16px;">Reactの基礎から応用まで学ぶ計画です。コンポーネント・Hooks・状態管理をカバーします。</p>
              <div style="max-width:480px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                  <span style="font-size:13px; color:#64748B;">達成率</span>
                  <span style="font-size:13px; font-weight:700; color:#2563EB;">0%</span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill" style="background:#2563EB; width:0%;"></div>
                </div>
                <p style="font-size:12px; color:#64748B; margin-top:6px;">🗓 目標日: 2026/07/15</p>
              </div>
            </div>
          </div>
          <div style="display:flex; gap:8px; flex-shrink:0; margin-left:16px;">
            <button class="btn-secondary">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
              編集
            </button>
            <button class="btn-danger">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
              削除
            </button>
          </div>
        </div>
      </div>

      <!-- Task List (EmptyState) -->
      <div class="section-card">
        <div class="section-header">
          <h2>タスク一覧</h2>
          <button class="btn-primary" style="padding:6px 14px; font-size:13px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            タスクを追加
          </button>
        </div>
        <!-- Empty State -->
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 32px; text-align:center;">
          <div style="width:72px; height:72px; border-radius:50%; background:#F1F5F9; display:flex; align-items:center; justify-content:center; margin-bottom:16px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="#94A3B8" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M12 12v4m0 0l-2-2m2 2l2-2"/>
            </svg>
          </div>
          <p style="font-size:15px; font-weight:600; color:#0F172A; margin-bottom:6px;">タスクがまだありません</p>
          <p style="font-size:13px; color:#64748B; margin-bottom:20px; max-width:280px;">学習を細かいタスクに分けて管理しましょう</p>
          <button class="btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            最初のタスクを追加
          </button>
        </div>
      </div>

      <!-- Comment Section -->
      <div class="section-card">
        <div class="section-header">
          <h2>コメント <span style="font-size:13px; font-weight:400; color:#64748B;">0件</span></h2>
        </div>
        <div style="padding:20px;">
          <div style="margin-bottom:20px;">
            <textarea placeholder="コメントを入力してください..."></textarea>
            <div style="display:flex; justify-content:flex-end; margin-top:8px;">
              <button class="btn-primary" style="padding:7px 16px; font-size:13px;">投稿する</button>
            </div>
          </div>
          <!-- Empty comments -->
          <div style="text-align:center; padding:24px; color:#94A3B8; font-size:13px;">
            まだコメントはありません
          </div>
        </div>
      </div>

    </main>
  </div>

  <div style="position:fixed; top:16px; right:16px; background:#92400E; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;">
    状態: タスクなし (EmptyState)
  </div>
</body>
</html>
